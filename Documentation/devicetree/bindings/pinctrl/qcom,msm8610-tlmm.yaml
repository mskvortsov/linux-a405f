%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/qcom,msm8610-tlmm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. MSM8610 TLMM block

maintainers:
  - Mikhael Skvortsov <mikhael.skvortsov@gmail.com>

description: |
  Top Level Mode Multiplexer pin controller in Qualcomm MSM8610 SoC.

allOf:
  - $ref: /schemas/pinctrl/qcom,tlmm-common.yaml#

properties:
  compatible:
    const: qcom,msm8610-tlmm

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  gpio-reserved-ranges: true

patternProperties:
  "-state$":
    oneOf:
      - $ref: "#/$defs/qcom-msm8610-tlmm-state"
      - patternProperties:
          "-pins$":
            $ref: "#/$defs/qcom-msm8610-tlmm-state"
        additionalProperties: false

$defs:
  qcom-msm8610-tlmm-state:
    type: object
    description:
      Pinctrl node's client devices use subnodes for desired pin configuration.
      Client device subnodes use below standard properties.
    $ref: qcom,tlmm-common.yaml#/$defs/qcom-tlmm-state
    unevaluatedProperties: false

    properties:
      pins:
        description:
          List of gpio pins affected by the properties specified in this
          subnode.
        items:
          oneOf:
            - pattern: "^gpio([0-9]|[1-9][0-9]|10[01])$"
            - enum: [ sdc1_clk, sdc1_cmd, sdc1_data, sdc2_clk, sdc2_cmd,
                      sdc2_data, cdc_i2c_scl, cdc_i2c_sda ]
        minItems: 1
        maxItems: 16

      function:
        description:
          Specify the alternative function to be configured for the specified
          pins.
        enum: [ blsp_i2c1, blsp_i2c2, blsp_i2c3, blsp_spi4, blsp_uart2,
                cam_mclk0, cam_mclk1, dmic0_clk, dmic0_data, gpio, wlan ]

    required:
      - pins

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    tlmm: pinctrl@fd510000 {
        compatible = "qcom,msm8610-tlmm";
        reg = <0xfd510000 0x4000>;
        interrupts = <GIC_SPI 208 IRQ_TYPE_LEVEL_HIGH>;
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&tlmm 0 0 102>;
        interrupt-controller;
        #interrupt-cells = <2>;

        uart-w-subnodes-state {
            tx-pins {
                pins = "gpio4";
                function = "blsp_uart2";
                drive-strength = <2>;
                bias-disable;
            };

            rx-pins {
                pins = "gpio5";
                function = "blsp_uart2";
                drive-strength = <2>;
                bias-pull-up;
            };
        };
    };
...
