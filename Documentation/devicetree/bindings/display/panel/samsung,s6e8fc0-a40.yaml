%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,s6e8fc0-a40.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Galaxy A40 S6E8FC0 1080x2340 AMOLED panel

maintainers:
  - Dzmitry Sankouski <dsankouski@gmail.com>

description:
  Samsung S6E8FC0 AMOLED panel variant found in the Samsung Galaxy A40.
  It is a 5.9 inch 1080x2340 MIPI-DSI video mode panel.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,s6e8fc0-a40

  reg:
    maxItems: 1

  reset-gpios: true

  vdd3p0-supply:
    description: 3.0V panel source voltage rail

  port: true

required:
  - compatible
  - reg
  - reset-gpios
  - vdd3p0-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,s6e8fc0-a40";
            reg = <0>;

            vdd3p0-supply = <&panel_3p0>;
            reset-gpios = <&gpg2 0 GPIO_ACTIVE_HIGH>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };

...
