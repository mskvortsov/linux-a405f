%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,msm8610-lpasscc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm LPASS Clock Controller on MSM8610

maintainers:
  - Mikhael Skvortsov <mikhael.skvortsov@gmail.com>

description: |
  Qualcomm LPASS clock controller provides the clocks of the internal
  digital audio codec on MSM8610. The other LPASS clocks are managed by the
  ADSP firmware.

  See also:
    include/dt-bindings/clock/qcom,msm8610-lpasscc.h

properties:
  compatible:
    const: qcom,msm8610-lpasscc

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Board XO source

  clock-names:
    items:
      - const: xo

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@fe000000 {
        compatible = "qcom,msm8610-lpasscc";
        reg = <0xfe000000 0x40000>;
        clocks = <&xo_board>;
        clock-names = "xo";
        #clock-cells = <1>;
    };
...
